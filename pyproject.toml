[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "houdini-mcp"
version = "0.2.0"
description = "Drive SideFX Houdini (live GUI or headless hython) from Claude Code and other MCP clients: safe edits, Karma previews, HDA editing, USD export, caches, synthetic training data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Felicity Yick" }]
keywords = ["houdini", "mcp", "model-context-protocol", "claude", "usd", "karma", "synthetic-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "mcp[cli]>=1.2,<2",
    "numpy",
    "pillow",
    "OpenEXR>=3.3",
    "imageio-ffmpeg>=0.5",
]

[project.urls]
Homepage = "https://github.com/feliyick/houdini-mcp"

[project.scripts]
houdini-mcp = "houdini_mcp.server:main"
houdini-mcp-install = "houdini_mcp.install:install_main"
houdini-mcp-headless = "houdini_mcp.install:headless_main"

[tool.setuptools]
packages = ["houdini_mcp"]

[tool.setuptools.package-data]
houdini_mcp = ["CAMERA_GUIDE.md", "houdini_pkg/python3.11libs/*.py"]
